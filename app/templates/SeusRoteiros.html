{% extends 'asider.html' %}

{% block conteudo %}
          <div class="main-content_kanban">
        <div class="header">
            <div id="nome-cidade">Meus Roteiros de Viagem</div>
            
            <div class="tabs">
                <button class="tab active">Geral</button>
                <button class="tab">Roteiro</button>
            </div>
        </div>
        
        <div class="kanban">
            <div class="day-column">
                <div class="containerdat">
                    <div class="day-header">Dia 1 | 17/09 • Terça</div>
                </div>
                
                <div class="task-card">
                    <p>Clique no botão + para adicionar um novo passeio</p>
                </div>
                
                <div class="add-task-container">
                    <button class="add-task" onclick="openModal()">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para cadastro de passeios -->
    <div id="tourModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Cadastro de Passeio</h2>
            
            <form id="tourForm">
                <div id="messageContainer"></div>
                
                <div class="form-group">
                    <label for="tourName">Nome do Passeio:</label>
                    <input type="text" id="tourName" name="tourName" required>
                </div>

                <div class="form-group">
                  <label for="tourDuration">Duração (hh:mm):</label>
                  <input type="time" id="tourDuration" name="tourDuration" step="60" required>
              </div>

                <div class="form-group">
                    <label for="tourPrice">Preço (R$):</label>
                    <input type="number" id="tourPrice" name="tourPrice" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="tourCategory">Categoria:</label>
                    <select id="tourCategory" name="tourCategory" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Cidade">Passeio pela Cidade</option>
                        <option value="Aventura">Aventura</option>
                        <option value="Gastronomia">Gastronomia</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Natureza">Natureza</option>
                        <option value="Praia">Praia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tourDescription">Descrição:</label>
                    <textarea id="tourDescription" name="tourDescription" rows="4" required></textarea>
                </div>

                <hr>
                <h3>Endereço do Passeio</h3>

                <div class="form-group">
                    <label for="tourCep">CEP:</label>
                    <input type="text" id="tourCep" name="tourCep" placeholder="00000-000" maxlength="9" required>
                </div>

                <div class="form-group">
                    <label for="tourRua">Rua:</label>
                    <input type="text" id="tourRua" name="tourRua" required>
                </div>

                <div class="form-group">
                    <label for="tourBairro">Bairro:</label>
                    <input type="text" id="tourBairro" name="tourBairro" required>
                </div>

                <div class="form-group">
                    <label for="tourComplemento">Complemento:</label>
                    <input type="text" id="tourComplemento" name="tourComplemento" placeholder="Ponto turístico, praça, etc.">
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-btn">Salvar</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
